services:
  # Сервис для бэкенда (NestJS)
  backend:
    build:
      context: ./backend # Путь к директории с Dockerfile бэкенда
      dockerfile: Dockerfile
      target: development # Используем этап development для разработки с hot-reload
    container_name: brainmessenger-backend
    env_file: # Add this line
      - ./backend/.env # Point to the backend's .env file
    # Монтируем исходный код бэкенда в контейнер для hot-reloading
    # Исключаем node_modules, чтобы использовать установленные в контейнере
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules # Anonymous volume for node_modules
    # Запускаем в режиме разработки с watch
    command: node dist/main
    ports:
      - "4000:4000" # Пробрасываем порт 4000 (бэкенд)
    environment: # Add this section
      - CHOKIDAR_USEPOLLING=true
      - APP_URL=http://localhost:3000
    networks:
      - brainmessenger-network
    mem_limit: 2048m # Увеличиваем лимит памяти для бэкенда



  # Сервис для базы данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: brainmessenger-db
    environment:
      POSTGRES_USER: brainmessenger_user
      POSTGRES_PASSWORD: brainmessenger_password
      POSTGRES_DB: brainmessenger_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Пробрасываем порт БД (5433 на хосте, 5432 в контейнере)
    networks:
      - brainmessenger-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainmessenger_user -d brainmessenger_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Даем БД время на запуск перед началом проверок

  # Сервис для Redis
  redis:
    image: redis:7-alpine # Используем официальный образ Redis
    container_name: brainmessenger-redis
    ports:
      - "6379:6379" # Пробрасываем стандартный порт Redis
    networks:
      - brainmessenger-network
    volumes:
      - redis-data:/data # Определяем именованный том для сохранения данных Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Сервис для Zookeeper (необходим для Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: brainmessenger-zookeeper
    ports:
      - "2181:2181" # Пробрасываем стандартный порт Zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - brainmessenger-network

  # Сервис для Kafka
  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: brainmessenger-kafka
    ports:
      - "9092:9092" # Пробрасываем стандартный порт Kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # Указываем адрес Zookeeper
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 # Внутренний адрес для других контейнеров
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data # Определяем именованный том для сохранения данных Kafka
    depends_on:
      - zookeeper # Kafka зависит от Zookeeper
    networks:
      - brainmessenger-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# Определяем сеть для взаимодействия контейнеров
networks:
  brainmessenger-network:
    driver: bridge

volumes:
  postgres-data: # Определяем именованный том для сохранения данных PostgreSQL
  redis-data: # Определяем именованный том для сохранения данных Redis
  kafka-data: # Определяем именованный том для сохранения данных Kafka
